<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Sahayog</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="auth-page">
    <div class="auth-card">
      <h2>Welcome back 👋</h2>
      <p class="auth-sub">Log in to manage your campaigns</p>

      <!-- Error / success alerts -->
      <div id="alert-error" class="alert alert-error" style="display:none">
        Invalid email or password. Please try again.
      </div>
      <div id="alert-registered" class="alert alert-success" style="display:none">
        Account created! Please log in.
      </div>

      <form action="/login" method="POST" novalidate id="login-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
          <div class="error-msg" id="email-err"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
          <div class="error-msg" id="pass-err"></div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Log In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Register here</a>
      </div>
    </div>
  </div>

  <script src="/js/navbar.js"></script>
  <script>
    // Show alerts based on URL params
    const params = new URLSearchParams(location.search);
    if (params.get('error') === 'invalid') document.getElementById('alert-error').style.display = '';
    if (params.get('registered') === '1') document.getElementById('alert-registered').style.display = '';

    // Client-side validation
    const form = document.getElementById('login-form');
    form.addEventListener('submit', (e) => {
      let ok = true;
      const email = document.getElementById('email');
      const pass = document.getElementById('password');
      const emailErr = document.getElementById('email-err');
      const passErr = document.getElementById('pass-err');

      emailErr.textContent = '';
      passErr.textContent = '';
      email.classList.remove('is-error');
      pass.classList.remove('is-error');

      if (!email.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
        emailErr.textContent = 'Enter a valid email address.';
        email.classList.add('is-error');
        ok = false;
      }
      if (!pass.value) {
        passErr.textContent = 'Password is required.';
        pass.classList.add('is-error');
        ok = false;
      }
      if (!ok) e.preventDefault();
    });
  </script>
</body>
</html>
